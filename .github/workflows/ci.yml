name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存パッケージをインストール
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 型チェック
        run: pnpm type-check

      - name: テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build
